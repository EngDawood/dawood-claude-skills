name: Sync find-oss-alternative

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-find-oss-alternative
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the skill from the source repo
        run: .github/scripts/sync-find-oss-alternative.sh

      - name: Commit and push if anything changed
        run: |
          if [ -z "$(git status --porcelain plugins/find-oss-alternative)" ]; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/find-oss-alternative
          git commit -m "find-oss-alternative: sync from source repo"
          git push
